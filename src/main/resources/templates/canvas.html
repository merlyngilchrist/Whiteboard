<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pen Together</title>
        <link rel="stylesheet" href="/css/canvas.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js" defer></script>
        <script src="/js/canvas.js" defer></script>
        <link rel="icon" href="/images/PenTogetherLogo.png" type="image/jpg">
    </head>
    <body>
        <canvas id="whiteboard" alt="Drawing canvas" class="fullscreen"></canvas>
        <div id="leftBarButtons">
            <!-- Pen button -->
            <button type="button" onclick="selectPenTool()" class="selectedTool" id="penButton">
                <img src="/images/pen.png" alt="Pen Tool">
            </button>
            <!-- Eraser button -->
            <button type="button" onclick="selectEraserTool()" class="unselectedTool" id="eraserButton">
                <img src="/images/eraser.png" alt="Eraser tool">
            </button>
            <!-- Circle button -->
            <button type="button" onclick="selectShapeTool('circle')" class="unselectedTool" id="circleButton">
                <img src="/images/circle.png" alt="Circle Tool">
            </button>
            <!-- Square button -->
            <button type="button" onclick="selectShapeTool('square')" class="unselectedTool" id="squareButton">
                <img src="/images/square.png" alt="Square Tool">
            </button>
            <!-- Triangle button -->
            <button type="button" onclick="selectShapeTool('triangle')" class="unselectedTool" id="triangleButton">
                <img src="/images/triangle.png" alt="Triangle Tool">
            </button>
            <!-- Fill button -->
            <button type="button" onclick="selectFillTool()" class="unselectedTool" id="fillButton">
                <img src="/images/paint-bucket.png" alt="Fill tool">
            </button>
            <!-- Text button -->
            <button type="button" onclick="selectTextTool()" class="unselectedTool" id="textButton">
                <img src="/images/letter-t-.png" alt="Text tool">
            </button>
            <!-- Color Picker button -->
            <button type="button" onclick="selectColorPicker()" class="unselectedTool" id="colorPickerButton">
                <img src="/images/dropper.png" alt="Color picker tool">
            </button>
        </div>
        <!-- Undo button -->
        <button type="button" onclick="undoButton()" class="unselectedTool" id="undoButton">
            <img src="/images/undo.png" alt="Undo">
        </button>
        <!-- Redo button -->
        <button type="button" onclick="redoButton()" class="unselectedTool" id="redoButton">
            <img src="/images/redo.png" alt="Redo">
        </button>

        <div id="penSizeMenu">
            <!-- Increase Pen Size button -->
            <button type="button" onclick="increasePenSizeButton()" class="unselectedTool" id="increasePenSizeButton">
                <img src="/images/plus.png" alt="Increase pen size">
            </button>
            <!-- Decrease Pen Size button -->
            <button type="button" onclick="decreasePenSizeButton()" class="unselectedTool" id="decreasePenSizeButton">
                <img src="/images/minus.png" alt="Decrease pen size">
            </button>
            <!-- Pen size text -->
            <div class="menuItem" id="penSizeItem">
                <p id="penSizeText">5px</p>
            </div>
        </div>

        <!-- Color buttons -->
        <div class="menuItem" id="colorMenuButton" onclick="displayColorOptions('true')">
            <div id="currentColorCircle"></div>
        </div>
        <div id="colorButtonsContainer">
            <div id="colorSet1">
                <div class="colorSelectRow1">
                    <div class="menuItem colorSelectCol1">
                        <div class="colorCircle" onclick="colorButtonPressed(this)"></div>
                    </div>
                    <div class="menuItem colorSelectCol2">
                        <div class="colorCircle" onclick="colorButtonPressed(this)"></div>
                    </div>
                    <div class="menuItem colorSelectCol3">
                        <div class="colorCircle" onclick="colorButtonPressed(this)"></div>
                    </div>
                </div>
                <div class="colorSelectRow2">
                    <div class="menuItem colorSelectCol1">
                        <div class="colorCircle" onclick="colorButtonPressed(this)"></div>
                    </div>
                    <div class="menuItem colorSelectCol2">
                        <div class="colorCircle" onclick="colorButtonPressed(this)"></div>
                    </div>
                    <div class="menuItem colorSelectCol3">
                        <div class="colorCircle" onclick="colorButtonPressed(this)"></div>
                    </div>
                </div>
                <div class="colorSelectRow3">
                    <div class="menuItem colorSelectCol1">
                        <div class="colorCircle" onclick="colorButtonPressed(this)"></div>
                    </div>
                    <div class="menuItem colorSelectCol2">
                        <div class="colorCircle" onclick="colorButtonPressed(this)"></div>
                    </div>
                    <div class="menuItem colorSelectCol3">
                        <div class="colorCircle" onclick="colorButtonPressed(this)"></div>
                    </div>
                </div>
                <div class="colorSelectRow4">
                    <div class="menuItem colorSelectCol1">
                        <div class="colorCircle" onclick="colorButtonPressed(this)"></div>
                    </div>
                    <div class="menuItem colorSelectCol2">
                        <div class="colorCircle" onclick="colorButtonPressed(this)"></div>
                    </div>
                    <div class="menuItem colorSelectCol3">
                        <div class="colorCircle" onclick="colorButtonPressed(this)"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Session code display text -->
        <div class="menuItem" id="sessionCodeContainer">
            <p>Session code:</p>
        </div>

        <!-- Color picker preview -->
        <div id="colorPickerPreview" class="colorCircle"></div>

        <!-- Cursor -->
        <div id="cursorCircle"></div>
        <div id="cursorUpdater"></div>
    </body>
    <footer>
        <table>
            <thead>External References</thead>
            <tr>
                <td><a href="https://www.flaticon.com/free-icons/serif" title="serif icons">Serif icons created by Freepik - Flaticon</a></td>
            </tr>
            <tr>
                <td><a href="https://www.flaticon.com/free-icons/rectangle" title="rectangle icons">Rectangle icons created by Vitaly Gorbachev - Flaticon</a></td>
            </tr>
            <tr>
                <td><a href="https://www.flaticon.com/free-icons/color-picker" title="color picker icons">Color picker icons created by Icongeek26 - Flaticon</a></td>
            </tr>
        </table>
    </footer>
</html>
