<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pen Together</title>
        <link rel="stylesheet" href="/css/canvas.css">
        <script src="/js/canvas.js" defer></script>
    </head>
    <body>
        <canvas id="whiteboard" alt="That's weird, a canvas should be here" class="fullscreen"></canvas>
        <button type="button" onclick="selectPenTool()" class="selectedTool" id="penButton">
            <img src="/images/pen.png" alt="Pen Tool">
        </button>
        <button type="button" onclick="selectEraserTool()" class="unselectedTool" id="eraserButton">
            <img src="/images/eraser.png" alt="Eraser tool">
        </button>
        <button type="button" onclick="selectFillTool()" class="unselectedTool" id="fillButton">
            <img src="/images/paint-bucket.png" alt="Paint Bucket Tool">
        </button>
        <button type="button" onclick="" class="unselectedTool" id="circleButton">
            <img src="/images/circle.png" alt="Circle Tool">
        </button>
        <button type="button" onclick="" class="unselectedTool" id="squareButton">
            <img src="/images/square.png" alt="Square Tool">
        </button>
        <button type="button" onclick="" class="unselectedTool" id="triangleButton">
            <img src="/images/triangle.png" alt="Triangle Tool">
        </button>
    </body>
    <footer>
        <table>
            <thead>External References</thead>
            <tr>
                <td><a href="https://www.flaticon.com/free-icons/serif" title="serif icons">Serif icons created by Freepik - Flaticon</a></td>
            </tr>
            <tr>
                <td><a href="https://www.flaticon.com/free-icons/rectangle" title="rectangle icons">Rectangle icons created by Vitaly Gorbachev - Flaticon</a></td>
            </tr>
            <tr>
                <td><a href="https://www.flaticon.com/free-icons/color-picker" title="color picker icons">Color picker icons created by Icongeek26 - Flaticon</a></td>
            </tr>
        </table>
    </footer>
</html>
